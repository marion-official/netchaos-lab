global
    log /dev/log local0
    stats socket /run/haproxy/admin.sock mode 660 level admin
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option dontlognull
    timeout connect 3s
    timeout client  30s
    timeout server  30s

frontend fe_shop
    bind 10.10.10.10:80
    default_backend be_web

backend be_web
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    default-server check inter 2s fall 2 rise 2
    server web1 10.10.10.11:80
    server web2 10.10.10.12:80

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 5s
