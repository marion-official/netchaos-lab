frr defaults datacenter
hostname border
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
ip route 0.0.0.0/0 10.0.9.1
!
router bgp 65103
 bgp router-id 10.255.1.3
 no bgp ebgp-requires-policy
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65000
 neighbor 10.0.1.4 peer-group SPINES
 neighbor 10.0.1.4 description spine1
 neighbor 10.0.2.4 peer-group SPINES
 neighbor 10.0.2.4 description spine2
 !
 address-family ipv4 unicast
  network 10.255.1.3/32
  network 0.0.0.0/0
  network 10.0.9.0/31
  maximum-paths 8
 exit-address-family
!
