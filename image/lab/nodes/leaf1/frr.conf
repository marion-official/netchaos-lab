frr defaults datacenter
hostname leaf1
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
router bgp 65101
 bgp router-id 10.255.1.1
 no bgp ebgp-requires-policy
 neighbor SPINES peer-group
 neighbor SPINES remote-as 65000
 neighbor 10.0.1.0 peer-group SPINES
 neighbor 10.0.1.0 description spine1
 neighbor 10.0.2.0 peer-group SPINES
 neighbor 10.0.2.0 description spine2
 !
 address-family ipv4 unicast
  network 10.255.1.1/32
  network 10.10.10.0/24
  maximum-paths 8
 exit-address-family
!
